---
- name: Create automation user
  ansible.builtin.user:
    name: devops
    shell: /bin/bash
    groups: sudo
    append: true
    create_home: true
- name: Create SSH directory
  ansible.builtin.file:
    path: /home/devops/.ssh
    state: directory
    owner: devops
    group: devops
    mode: "0700"
- name: Install automation public key
  ansible.posix.authorized_key:
    user: devops
    state: present
    key: "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/devops_vm.pub') }}"
    manage_dir: false
- name: Allow non-interactive automation sudo
  ansible.builtin.copy:
    content: "devops ALL=(ALL) NOPASSWD:ALL\n"
    dest: /etc/sudoers.d/devops
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
- name: Harden SSH only after key installation
  ansible.builtin.copy:
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      PubkeyAuthentication yes
      PermitEmptyPasswords no
      AllowUsers student devops
      X11Forwarding no
    dest: /etc/ssh/sshd_config.d/00-ansible-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: "sshd -t -f %s"
  notify: Restart SSH
- name: Read active firewall configuration
  ansible.builtin.command: ufw status verbose
  environment:
    LC_ALL: C
  register: firewall_status
  changed_when: false
- name: Retain rate limiting on the existing SSH port
  community.general.ufw:
    rule: limit
    port: "{{ ansible_port }}"
    proto: tcp
  when: firewall_status.stdout is not search('(?m)^' ~ ansible_port ~ '/tcp\s+LIMIT IN')
- name: Allow HTTP
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp
  when: firewall_status.stdout is not search('(?m)^80/tcp\s+ALLOW IN')
- name: Set incoming firewall policy
  community.general.ufw:
    default: deny
    direction: incoming
  when: "'Default: deny (incoming)' not in firewall_status.stdout"
- name: Set outgoing firewall policy
  community.general.ufw:
    default: allow
    direction: outgoing
  when: "'allow (outgoing)' not in firewall_status.stdout"
- name: Set firewall logging
  community.general.ufw:
    logging: low
  when: "'Logging: on (low)' not in firewall_status.stdout"
- name: Enable firewall
  community.general.ufw:
    state: enabled
  when: "'Status: active' not in firewall_status.stdout"
